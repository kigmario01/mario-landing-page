# Rate Limiting: 15 peticiones por segundo por IP con tolerancia de ráfaga
limit_req_zone $binary_remote_addr zone=landing_limit:10m rate=15r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Ocultar firma y versión de Nginx
    server_tokens off;

    # 2. Cabeceras de seguridad estrictas (Alineadas a OWASP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

    # 3. Rate Limiting defensivo anti-abuso y anti-fuzzing (HTTP 429)
    limit_req_status 429;
    limit_req zone=landing_limit burst=30 nodelay;

    # 4. Restringir métodos HTTP: Solo permitir lectura segura (GET y HEAD)
    if ($request_method !~ ^(GET|HEAD)$ ) {
        return 405;
    }

    # 5. Bloqueo estricto de Dockerfile, docker-compose, configs y archivos del sistema
    location ~* (Dockerfile|docker-compose|\.env|\.git|nginx\.conf|package\.json) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 6. Bloqueo estricto de archivos ocultos o de metadatos
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 7. Bloqueo de extensiones peligrosas, backups o scripts
    location ~* \.(bak|conf|sql|ini|sh|py|php|yml|yaml|md|log|env)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 8. Caché y optimización de estáticos (preservando cabeceras de seguridad)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;
    }

    # 9. Enrutamiento principal
    location / {
        try_files $uri $uri/ /index.html;
    }
}
